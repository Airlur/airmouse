name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 读取版本号
        id: ver
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          if [ -z "$VERSION" ]; then
            echo "无法从 build.gradle.kts 读取 versionName"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "检测到版本：$VERSION"

      - name: 编译 Release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: 整理产物
        run: |
          mkdir -p out
          ls -1 app/build/outputs/apk/release/
          cp app/build/outputs/apk/release/app-release.apk "out/AirMouse-${{ steps.ver.outputs.version }}.apk"
          ls -lh out

      - name: 校验签名
        run: |
          APK="out/AirMouse-${{ steps.ver.outputs.version }}.apk"
          BT=$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          echo "使用 build-tools: $BT"
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$APK"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: AirMouse-${{ steps.ver.outputs.version }}
          path: out/*.apk
          retention-days: 90

      - name: 发布 Release（按版本号打 tag）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: AirMouse ${{ steps.ver.outputs.version }}
          body: |
            ## AirMouse ${{ steps.ver.outputs.version }}

            Android 手机当蓝牙鼠标用，目标设备（平板 / 电脑 / 电视）无需安装任何东西。

            ### 安装
            手机浏览器点下方 `AirMouse-${{ steps.ver.outputs.version }}.apk` 下载，允许「未知来源」后安装。

            > 首次安装需卸载旧版本（早期构建签名不固定）；从本版起签名已固定，后续版本可直接覆盖升级。

            ### 说明
            - 正式构建（Release 变体，非调试包）
            - 签名固定，可覆盖升级
            - 完整改动记录见仓库提交历史
          files: out/*.apk
          fail_on_unmatched_files: true
