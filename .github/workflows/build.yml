name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 读取版本号
        id: ver
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          if [ -z "$VERSION" ]; then
            echo "无法从 build.gradle.kts 读取 versionName"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "检测到版本：$VERSION"

      - name: 编译 Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: 整理产物
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/AirMouse-${{ steps.ver.outputs.version }}.apk"
          ls -lh out

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: AirMouse-${{ steps.ver.outputs.version }}
          path: out/*.apk
          retention-days: 90

      - name: 发布 Release（按版本号打 tag）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: AirMouse ${{ steps.ver.outputs.version }}
          body: |
            AirMouse ${{ steps.ver.outputs.version }}

            自动构建的 Debug 版 APK。手机浏览器打开本页面，点下方文件即可下载安装。
          files: out/*.apk
          fail_on_unmatched_files: true
